<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Date-Anfrage für Lisa</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#f8e8e8,#eee8f8);margin:0;padding:24px;color:#242424}
.card{max-width:520px;margin:20px auto;background:#fff;border-radius:28px;padding:30px;box-shadow:0 15px 45px #0002}
h1{font-size:30px;margin:0 0 10px}.intro{line-height:1.55;color:#555}
label{display:block;font-weight:600;margin:22px 0 8px}
input,textarea{width:100%;padding:14px 15px;border:1px solid #ddd;border-radius:13px;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:#777}textarea{min-height:90px;resize:vertical}
button{width:100%;border:0;border-radius:14px;padding:15px;background:#222;color:white;font-size:17px;font-weight:600;margin-top:24px;cursor:pointer}
.result{display:none;margin-top:22px;padding:16px;border-radius:14px;background:#f3f3f3;line-height:1.5}
.small{font-size:12px;color:#888;margin-top:18px}
</style>
</head>
<body>
<div class="card">
<h1>Lisa, Date? ❤️</h1>
<p class="intro">Such dir einen Termin aus, an dem du Zeit und Lust hast. 😉</p>

<label for="date">Wann hast du Zeit?</label>
<input id="date" type="date">

<label for="time">Und ungefähr welche Uhrzeit?</label>
<input id="time" type="time">

<label for="note">Noch etwas dazu?</label>
<textarea id="note" placeholder="z. B. „Ich freue mich 😊“"></textarea>

<button onclick="submitDate()">Date anfragen ❤️</button>

<div id="result" class="result"></div>

</div>

<script>
function submitDate(){
 const d=document.getElementById('date').value;
 const t=document.getElementById('time').value;
 const n=document.getElementById('note').value.trim();
 if(!d||!t){alert("Such dir bitte Datum und Uhrzeit aus 😊");return;}
 const [y,m,day]=d.split("-");
 const formatted=day+"."+m+"."+y;
 const text="Lisa hat ein Date vorgeschlagen ❤️\n\nDatum: "+formatted+"\nUhrzeit: "+t+" Uhr"+(n?"\n\nNachricht: "+n:"");
 const r=document.getElementById('result');
 r.style.display="block";
 r.innerHTML="<strong>Date-Anfrage vorbereitet ❤️</strong><br><br>"+text.replaceAll("\n","<br>");
 if(navigator.share){
   navigator.share({title:"Date mit Lisa ❤️",text:text}).catch(()=>{});
 }
}
</script>
</body>
</html>
